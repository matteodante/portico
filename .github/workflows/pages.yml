name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.12
          actions-cache-folder: emsdk-cache

      - name: Build the samples
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          emcmake cmake -S . -B build/web -G Ninja -DCMAKE_BUILD_TYPE=Release -DPORTICO_BUILD_TESTS=OFF
          cmake --build build/web

      - name: Site
        run: |
          mkdir -p site
          cp web/index.html site/
          cp LICENSE site/LICENSE.txt
          cp samples/LICENSE-Microsoft-DirectX-SDK-Samples.txt site/LICENSE-samples.txt
          cp build/web/samples/*.html build/web/samples/*.js build/web/samples/*.wasm site/
          cp build/web/samples/*.data site/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
