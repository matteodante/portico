name: Demo

# The demo is hosted on matteodante.it. Enable Pages before dispatching this optional deployment.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.12
          actions-cache-folder: emsdk-cache

      - name: Build the samples
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          emcmake cmake -S . -B build/web -G Ninja -DCMAKE_BUILD_TYPE=Release -DPORTICO_BUILD_TESTS=OFF
          cmake --build build/web

      - name: Site and license notices
        run: python3 tools/package_demo.py --samples build/web/samples --out site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
