<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portico sample</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #15171a; color: #d6d8dc;
         font: 14px/1.4 system-ui, sans-serif; }
  canvas { display: block; outline: none; }
  #message { position: fixed; left: 12px; right: 12px; bottom: 12px; text-align: center; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0"></canvas>
<div id="message"></div>
<script>
  // Portico gives the program's thread back to the browser through JSPI (WebAssembly JavaScript Promise Integration).
  if (!('Suspending' in WebAssembly && 'promising' in WebAssembly)) {
    document.getElementById('message').textContent =
      'This browser cannot run the sample: it lacks WebAssembly JSPI (Chrome or Edge 137+, Firefox 153+, Safari 27+).';
  }
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (text) { console.log(text); },
    printErr: function (text) { console.warn(text); },
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
